name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      edition:
        description: 'Edizione da buildare'
        required: false
        default: 'both'
        type: choice
        options:
          - both
          - base
          - full

permissions:
  contents: write

jobs:
  # Job-level `if` non può leggere il contesto `matrix` (non è ancora
  # materializzato), quindi la matrice va filtrata qui e passata al job
  # `build` già pronta via fromJSON.
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - id: set
        shell: bash
        run: |
          EDITION="both"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            EDITION="${{ inputs.edition }}"
          fi

          BASE='{"os":"ubuntu-22.04","edition":"base","artifact":"oql-linux-base","ext":"AppImage"},{"os":"macos-15-intel","edition":"base","artifact":"oql-macos-base","ext":"dmg"},{"os":"windows-2022","edition":"base","artifact":"oql-windows-base","ext":"exe"}'
          FULL='{"os":"ubuntu-22.04","edition":"full","artifact":"oql-linux-full","ext":"AppImage"},{"os":"macos-15-intel","edition":"full","artifact":"oql-macos-full","ext":"dmg"},{"os":"windows-2022","edition":"full","artifact":"oql-windows-full","ext":"exe"}'

          case "$EDITION" in
            base) ITEMS="$BASE" ;;
            full) ITEMS="$FULL" ;;
            *) ITEMS="$BASE,$FULL" ;;
          esac

          echo "matrix={\"include\":[$ITEMS]}" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}

    runs-on: ${{ matrix.os }}

    steps:
      # ── Checkout ──────────────────────────────────────────────
      - uses: actions/checkout@v4

      # ── Qt 6.9 ────────────────────────────────────────────────
      # v3 dell'action. 6.5.3 rotto su macOS 26 "Tahoe": linka ancora
      # AGL.framework, rimosso dall'SDK (ld: framework 'AGL' not found).
      # 6.8.4+ è solo commerciale (non disponibile via aqt open-source);
      # 6.9.x è l'ultimo ramo open-source che include la fix Tahoe.
      # qtsvg e qtdeclarative sono nel pacchetto base di Qt 6.9.
      # qtmultimedia è l'unico addon separato necessario.
      - name: Install Qt 6
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.9.3'
          arch: ${{ runner.os == 'Windows' && 'win64_msvc2022_64' || '' }}
          modules: 'qtmultimedia'
          cache: true

      # ── Linux deps ────────────────────────────────────────────
      # R9: deps identiche a build-linux.yml/build-beta.yml, centralizzate qui.
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        uses: ./.github/actions/install-linux-deps

      # ── macOS deps ────────────────────────────────────────────
      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install lilv sound-touch pkg-config

      # ── Windows deps (vcpkg) ──────────────────────────────────
      # R9: deps identiche a build-windows.yml/build-beta.yml, centralizzate qui.
      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        uses: ./.github/actions/install-windows-deps

      # ── Configure (Linux) ─────────────────────────────────────
      - name: Configure (Linux)
        if: runner.os == 'Linux'
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DOQL_EDITION=${{ matrix.edition }}

      # ── Configure (macOS) ─────────────────────────────────────
      - name: Configure (macOS)
        if: runner.os == 'macOS'
        run: |
          export PKG_CONFIG_PATH="$(brew --prefix)/lib/pkgconfig:$(brew --prefix)/share/pkgconfig"
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DOQL_EDITION=${{ matrix.edition }} \
            -DCMAKE_PREFIX_PATH="${Qt6_DIR}"

      # ── Configure (Windows) ───────────────────────────────────
      - name: Configure (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vcpkgRoot = $env:VCPKG_INSTALLATION_ROOT
          $env:PKG_CONFIG_PATH = "$vcpkgRoot\installed\x64-windows\lib\pkgconfig"
          cmake -S . -B build `
            -DCMAKE_BUILD_TYPE=Release `
            -DOQL_EDITION=${{ matrix.edition }} `
            -DCMAKE_TOOLCHAIN_FILE="$vcpkgRoot/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows

      # ── Build ─────────────────────────────────────────────────
      - name: Build
        run: cmake --build build --config Release --parallel

      # ── Package — Linux (.AppImage) ───────────────────────────
      # R9: stesso blocco di build-linux.yml/build-beta.yml, ora centralizzato.
      - name: Package (Linux)
        if: runner.os == 'Linux'
        uses: ./.github/actions/package-linux-appimage
        with:
          artifact-name: ${{ matrix.artifact }}

      # ── Package — macOS (.dmg) ────────────────────────────────
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          APP=$(find build -name "oql.app" -maxdepth 4 | head -1)
          echo "Found app bundle: $APP"
          "${Qt6_DIR}/bin/macdeployqt" "$APP" -dmg
          DMG=$(find build -name "oql.dmg" -maxdepth 4 | head -1)
          echo "Found dmg: $DMG"
          mv "$DMG" ${{ matrix.artifact }}.dmg

      # ── Package — Windows (.exe installer) ───────────────────
      # R9: stesso blocco di build-windows.yml/build-beta.yml, ora centralizzato.
      - name: Package (Windows)
        if: runner.os == 'Windows'
        uses: ./.github/actions/package-windows-installer
        with:
          artifact-name: ${{ matrix.artifact }}

      # ── Upload artifact ───────────────────────────────────────
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.${{ matrix.ext }}

      # ── Create / update GitHub Release ───────────────────────
      - name: Publish to GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact }}.${{ matrix.ext }}
          generate_release_notes: true
