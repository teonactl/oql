name: Build Beta (Full + scadenza)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      expiry:
        description: 'Data scadenza beta (YYYY-MM-DD)'
        required: false
        default: '2027-06-21'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            artifact: oql-beta-linux
            ext: AppImage

          - os: macos-15-intel  # macos-13 ritirato da GitHub a dic 2025
            artifact: oql-beta-macos-x64
            ext: dmg

          - os: macos-15        # arm64 — macos-latest è ora macOS 26 (Tahoe)
            artifact: oql-beta-macos-arm64
            ext: dmg

          - os: windows-2022
            artifact: oql-beta-windows
            ext: exe

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.9.3'
          arch: ${{ runner.os == 'Windows' && 'win64_msvc2022_64' || '' }}
          modules: 'qtmultimedia'
          cache: true

      # ── Linux ────────────────────────────────────────────────────
      # R9: deps identiche a build-linux.yml/release.yml, centralizzate qui.
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        uses: ./.github/actions/install-linux-deps

      - name: Configure (Linux)
        if: runner.os == 'Linux'
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DOQL_EDITION=full \
            -DOQL_BETA_EXPIRY="${{ inputs.expiry || '2027-06-21' }}"

      # ── macOS ────────────────────────────────────────────────────
      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install lilv sound-touch pkg-config librsvg

      - name: Generate icon (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir resources/oql.iconset
          for size in 16 32 128 256 512; do
            rsvg-convert -w $size -h $size resources/oql.svg \
              -o resources/oql.iconset/icon_${size}x${size}.png
            rsvg-convert -w $((size*2)) -h $((size*2)) resources/oql.svg \
              -o resources/oql.iconset/icon_${size}x${size}@2x.png
          done
          iconutil -c icns resources/oql.iconset -o resources/oql.icns

      - name: Configure (macOS)
        if: runner.os == 'macOS'
        run: |
          export PKG_CONFIG_PATH="$(brew --prefix)/lib/pkgconfig:$(brew --prefix)/share/pkgconfig"
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DOQL_EDITION=full \
            -DOQL_BETA_EXPIRY="${{ inputs.expiry || '2027-06-21' }}" \
            -DCMAKE_PREFIX_PATH="${Qt6_DIR}"

      # ── Windows ──────────────────────────────────────────────────
      # R9: deps identiche a build-windows.yml/release.yml, centralizzate qui.
      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        uses: ./.github/actions/install-windows-deps

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vcpkgRoot = $env:VCPKG_INSTALLATION_ROOT
          $env:PKG_CONFIG_PATH = "$vcpkgRoot\installed\x64-windows\lib\pkgconfig"
          cmake -S . -B build `
            -DCMAKE_BUILD_TYPE=Release `
            -DOQL_EDITION=full `
            "-DOQL_BETA_EXPIRY=${{ inputs.expiry || '2027-06-21' }}" `
            -DCMAKE_TOOLCHAIN_FILE="$vcpkgRoot/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows

      # ── Build ─────────────────────────────────────────────────────
      - name: Build
        run: cmake --build build --config Release --parallel

      # ── Package Linux ─────────────────────────────────────────────
      # R9: stesso blocco di build-linux.yml/release.yml, ora centralizzato.
      - name: Package (Linux)
        if: runner.os == 'Linux'
        uses: ./.github/actions/package-linux-appimage
        with:
          artifact-name: ${{ matrix.artifact }}

      # ── Package macOS ─────────────────────────────────────────────
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          APP=$(find build -name "oql.app" -maxdepth 4 | head -1)
          echo "Found app bundle: $APP"
          "${Qt6_DIR}/bin/macdeployqt" "$APP"
          find "$APP/Contents/Frameworks" -maxdepth 1 -name "*.dylib" \
            -exec codesign --sign - --force {} \;
          find "$APP/Contents/PlugIns" -name "*.dylib" \
            -exec codesign --sign - --force {} \;
          find "$APP/Contents/Frameworks" -maxdepth 1 -name "*.framework" | while read fw; do
            bin=$(basename "$fw" .framework)
            find "$fw" -type f -name "$bin" -exec codesign --sign - --force {} \;
            codesign --sign - --force "$fw"
          done
          codesign --sign - --force "$APP"
          STAGING=$(mktemp -d)
          ditto "$APP" "$STAGING/OQL.app"
          hdiutil create -volname "OQL" \
            -srcfolder "$STAGING" \
            -ov -format UDZO \
            ${{ matrix.artifact }}.dmg
          rm -rf "$STAGING"

      # ── Package Windows ───────────────────────────────────────────
      # R9: stesso blocco di build-windows.yml/release.yml, ora centralizzato.
      - name: Package (Windows)
        if: runner.os == 'Windows'
        uses: ./.github/actions/package-windows-installer
        with:
          artifact-name: ${{ matrix.artifact }}

      # ── Upload artifact (30-day backup) ──────────────────────────
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.${{ matrix.ext }}
          retention-days: 30

      # ── Publish to beta-latest release (URL stabile) ─────────────
      - name: Publish to beta-latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: beta-latest
          name: "Beta — versione di test (scade ${{ inputs.expiry || '2027-06-21' }})"
          prerelease: true
          body: |
            **Versione BETA per test interno.**

            - Scade il ${{ inputs.expiry || '2027-06-21' }}
            - Edizione: Full (include tutti i cue type)
            - Non distribuire a terzi

            Build automatica via GitHub Actions.
          files: ${{ matrix.artifact }}.${{ matrix.ext }}
