name: Build Windows

on:
  push:
    branches: [main, feature/**]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.9.3'
          arch: 'win64_msvc2022_64'
          modules: 'qtmultimedia'
          cache: true

      - name: Cache vcpkg
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.VCPKG_INSTALLATION_ROOT }}/installed
            ${{ env.VCPKG_INSTALLATION_ROOT }}/packages
          key: vcpkg-windows-lilv-soundtouch-${{ hashFiles('**/CMakeLists.txt') }}
          restore-keys: vcpkg-windows-lilv-soundtouch-

      # R9: deps identiche a build-beta.yml/release.yml, centralizzate qui.
      - name: Install dependencies (Windows)
        uses: ./.github/actions/install-windows-deps

      - name: Configure
        shell: pwsh
        run: |
          $vcpkgRoot = $env:VCPKG_INSTALLATION_ROOT
          $env:PKG_CONFIG_PATH = "$vcpkgRoot\installed\x64-windows\lib\pkgconfig"
          cmake -S . -B build `
            -DCMAKE_BUILD_TYPE=Release `
            -DOQL_EDITION=full `
            -DCMAKE_TOOLCHAIN_FILE="$vcpkgRoot/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows

      - name: Build
        run: cmake --build build --config Release --parallel

      # R9: stesso blocco di build-beta.yml/release.yml a meno del nome del
      # file risultante, ora centralizzato e parametrizzato.
      - name: Package
        uses: ./.github/actions/package-windows-installer
        with:
          artifact-name: oql-windows-ci

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: oql-windows-ci
          path: oql-windows-ci.exe
          retention-days: 7

      - name: Publish dev-latest
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev-latest
          name: "Dev build (latest main)"
          prerelease: true
          make_latest: false
          body: "Ultima build automatica dal branch `main`. Aggiornata ad ogni commit."
          files: oql-windows-ci.exe
