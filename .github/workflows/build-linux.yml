name: Build Linux

on:
  push:
    branches: [main, feature/**]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.9.3'
          modules: 'qtmultimedia'
          cache: true

      # R9: deps identiche a build-beta.yml/release.yml, centralizzate qui.
      - name: Install dependencies
        uses: ./.github/actions/install-linux-deps

      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DOQL_EDITION=full

      - name: Build
        run: cmake --build build --parallel

      # R9: stesso blocco di build-beta.yml/release.yml a meno del nome del
      # file risultante, ora centralizzato e parametrizzato.
      - name: Package AppImage
        uses: ./.github/actions/package-linux-appimage
        with:
          artifact-name: oql-linux

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: oql-linux-ci
          path: oql-linux.AppImage
          retention-days: 7

      - name: Publish dev-latest
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev-latest
          name: "Dev build (latest main)"
          prerelease: true
          make_latest: false
          body: "Ultima build automatica dal branch `main`. Aggiornata ad ogni commit."
          files: oql-linux.AppImage
